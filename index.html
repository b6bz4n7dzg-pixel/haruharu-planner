<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8f6">
<link rel="manifest" href="manifest.json">
<title>하루하루</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#242424;--sub:#8a8a86;--line:#e9e9e5;--accent:#5f655d;--accent2:#eceee9;--danger:#b86b67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:22px 16px 100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:800;letter-spacing:-.8px}.date{font-size:12px;color:var(--sub);margin-top:3px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:#ededeb;border-radius:15px;margin-bottom:14px}.nav button{border:0;background:transparent;padding:10px 4px;border-radius:11px;font-size:13px;color:#777}.nav button.on{background:#fff;color:var(--text);font-weight:750;box-shadow:0 1px 5px #00000008}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:16px;font-weight:750}.sub{font-size:12px;color:var(--sub);line-height:1.5}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:12px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.progress{height:6px;background:#ededeb;border-radius:9px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent);border-radius:9px}
.list{margin-top:9px}.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.check{width:21px;height:21px;border:1.5px solid #c8c8c3;border-radius:7px;background:#fff;flex:none}.check.done{background:var(--accent);border-color:var(--accent);color:#fff}.check.done:after{content:"✓";font-size:13px}.grow{flex:1}.strike{text-decoration:line-through;color:#aaa}.tag{display:inline-block;background:var(--accent2);color:#666;padding:3px 7px;border-radius:20px;font-size:10px;margin-top:4px}.empty{text-align:center;color:var(--sub);font-size:12px;padding:18px 0}
.routine{display:grid;grid-template-columns:50px 21px 1fr auto;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.routine:last-child{border:0}.time{font-size:11px;color:var(--sub)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}.dow{text-align:center;color:var(--sub);font-size:10px;padding:5px}.day{min-height:55px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;font-size:11px}.day.today{border:2px solid var(--accent)}.day.sel{background:var(--accent2)}.dots{margin-top:5px;display:flex;gap:3px;flex-wrap:wrap}.dot{width:4px;height:4px;border-radius:50%;background:#777}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.wc{min-height:130px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff}.wc.today{border:2px solid var(--accent)}.wday{text-align:center;color:var(--sub);font-size:10px}.wn{font-size:12px;font-weight:750;margin:5px 0}.mini{font-size:9px;background:var(--accent2);border-radius:5px;padding:4px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goals{display:grid;gap:7px;margin-top:10px}.goal{display:flex;gap:8px;align-items:center;padding:8px 0}.goal input{flex:1;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 2px;outline:none}
.form{display:grid;gap:9px;margin-top:12px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.sheetback{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:min(760px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.hidden{display:none!important}.sectiongap{height:2px}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">하루하루</div><div class="date" id="dateText"></div></div><button class="iconbtn" id="todayBtn">오늘</button></header>
<nav class="nav" id="nav">
<button data-page="today">오늘</button><button data-page="week">주간</button><button data-page="month">월간</button><button data-page="settings">설정</button>
</nav>
<main id="view"></main>
</div>
<div id="modal" class="sheetback hidden"><div class="sheet"><div class="head"><b id="mTitle"></b><button class="iconbtn" id="close">×</button></div><div id="mBody"></div></div></div>
<script>
"use strict";
const KEY="haruharu_v2";
const $=id=>document.getElementById(id);
const today=new Date(); let selected=new Date(); let page="today";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
 goals:[],
 tasks:[],
 routine:[
  {id:1,time:"07:00",text:"기상 · 물 한 잔",done:false},
  {id:2,time:"07:10",text:"세수 · 양치",done:false},
  {id:3,time:"07:30",text:"가벼운 정리 / 스트레칭",done:false},
  {id:4,time:"07:45",text:"아침 식사",done:false},
  {id:5,time:"08:10",text:"오늘 계획 확인",done:false}
 ],
 notes:""
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const fmt=d=>new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(d);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function openModal(title,body){$("mTitle").textContent=title;$("mBody").innerHTML=body;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
function setPage(p){page=p;selected=new Date();render()}
function render(){ $("dateText").textContent=fmt(selected);document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.page===page));$("view").innerHTML=page==="today"?todayPage():page==="week"?weekPage():page==="month"?monthPage():settingsPage()}
function taskForm(date=iso(selected)){openModal("할 일 추가",`<div class="form"><input id="tText" placeholder="예: 수학 기출 1회"><div class="two"><input id="tDate" type="date" value="${date}"><select id="tCat"><option>공부</option><option>일상</option><option>집안일</option><option>약속</option><option>기타</option></select></div><div class="actions"><button class="btn" id="cancel">취소</button><button class="btn primary" id="saveTask">추가</button></div></div>`);$("cancel").onclick=closeModal;$("saveTask").onclick=()=>{let text=$("tText").value.trim();if(!text)return;db.tasks.push({id:Date.now(),date:$("tDate").value,text,cat:$("tCat").value,done:false});save();closeModal();render()}}
function goalForm(){openModal("월간 목표 추가",`<div class="form"><input id="gText" placeholder="예: 확통 개념 완강"><div class="actions"><button class="btn" id="cancel">취소</button><button class="btn primary" id="saveGoal">추가</button></div></div>`);$("cancel").onclick=closeModal;$("saveGoal").onclick=()=>{let text=$("gText").value.trim();if(!text)return;db.goals.push({id:Date.now(),text,done:false});save();closeModal();render()}}
function routineForm(){openModal("아침 루틴 추가",`<div class="form"><div class="two"><input id="rTime" type="time"><input id="rText" placeholder="루틴 내용"></div><div class="actions"><button class="btn" id="cancel">취소</button><button class="btn primary" id="saveRoutine">추가</button></div></div>`);$("cancel").onclick=closeModal;$("saveRoutine").onclick=()=>{let text=$("rText").value.trim();if(!text)return;db.routine.push({id:Date.now(),time:$("rTime").value||"",text,done:false});db.routine.sort((a,b)=>(a.time||"").localeCompare(b.time||""));save();closeModal();render()}}
function routineEditForm(id){let x=db.routine.find(v=>v.id===id);if(!x)return;openModal("아침 루틴 수정",`<div class="form"><div class="two"><input id="rTime" type="time" value="${esc(x.time||"")}"><input id="rText" value="${esc(x.text)}" placeholder="루틴 내용"></div><div class="actions"><button class="btn" id="cancel">취소</button><button class="btn primary" id="saveRoutine">저장</button></div></div>`);$("cancel").onclick=closeModal;$("saveRoutine").onclick=()=>{let text=$("rText").value.trim();if(!text)return;x.time=$("rTime").value||"";x.text=text;db.routine.sort((a,b)=>(a.time||"").localeCompare(b.time||""));save();closeModal();render()}}
function toggle(type,id){let a=db[type],x=a.find(v=>v.id===id);if(x)x.done=!x.done;save();render()}
function del(type,id){db[type]=db[type].filter(x=>x.id!==id);save();render()}
function taskList(date){let arr=db.tasks.filter(x=>x.date===date);return arr.length?arr.map(x=>`<div class="item"><button class="check ${x.done?"done":""}" data-toggle="tasks" data-id="${x.id}"></button><div class="grow"><div class="${x.done?"strike":""}">${esc(x.text)}</div><span class="tag">${esc(x.cat)}</span></div><button class="sub" data-del="tasks" data-id="${x.id}">삭제</button></div>`).join(""):`<div class="empty">오늘 할 일이 없어요. 하나만 추가해볼까요?</div>`}
function todayPage(){let d=iso(selected),tasks=db.tasks.filter(x=>x.date===d),done=tasks.filter(x=>x.done).length,rDone=db.routine.filter(x=>x.done).length;return `
<div class="card"><div class="head"><div><div class="title">${iso(selected)===iso(today)?"오늘":"선택한 날"}</div><div class="sub">${fmt(selected)}</div></div><button class="btn primary" id="addTask">+ 할 일</button></div><div class="progress"><i style="width:${tasks.length?done/tasks.length*100:0}%"></i></div><div class="sub" style="margin-top:7px">${done}/${tasks.length} 완료</div></div>
<div class="card"><div class="head"><div><div class="title">☀️ 아침 루틴</div><div class="sub">${rDone}/${db.routine.length} 완료</div></div><button class="btn" id="addRoutine">+ 루틴</button></div><div class="list">${db.routine.map(x=>`<div class="routine"><span class="time">${esc(x.time||"")}</span><button class="check ${x.done?"done":""}" data-toggle="routine" data-id="${x.id}"></button><span class="${x.done?"strike":""}">${esc(x.text)}</span><span style="display:flex;gap:4px"><button class="sub" data-edit-routine="${x.id}">수정</button><button class="sub" data-del-routine="${x.id}">삭제</button></span></div>`).join("")}</div></div>
<div class="card"><div class="head"><div class="title">📌 오늘 할 일</div><span class="sub">${tasks.length}개</span></div><div class="list">${taskList(d)}</div></div>
<div class="card"><div class="head"><div><div class="title">🎯 이번 달 목표</div><div class="sub">큰 목표는 여기, 실제 행동은 오늘 할 일에.</div></div><button class="btn" id="addGoal">+ 목표</button></div><div class="list">${db.goals.length?db.goals.map(x=>`<div class="item"><button class="check ${x.done?"done":""}" data-toggle="goals" data-id="${x.id}"></button><span class="${x.done?"strike":""} grow">${esc(x.text)}</span></div>`).join(""):`<div class="empty">이번 달 목표를 추가해보세요.</div>`}</div></div>`}
function monday(d){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function weekPage(){let s=monday(selected),cells="",names=["월","화","수","목","금","토","일"];for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i),id=iso(d),ts=db.tasks.filter(x=>x.date===id);cells+=`<div class="wc ${id===iso(today)?"today":""}" data-date="${id}"><div class="wday">${names[i]}</div><div class="wn">${d.getDate()}일</div>${ts.slice(0,5).map(x=>`<div class="mini">${x.done?"✓ ":""}${esc(x.text)}</div>`).join("")}</div>`}return `<div class="card"><div class="head"><div><div class="title">🗓️ 이번 주</div><div class="sub">${iso(s)} ~ ${iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+6))}</div></div><button class="btn primary" id="addTask">+ 할 일</button></div><div class="week">${cells}</div></div><div class="card"><div class="title">이번 주를 이렇게 써보세요</div><div class="sub" style="margin-top:7px">월간 목표를 보고 이번 주에 실제로 할 일을 날짜별로 내려놓은 다음, 오늘 탭에서 하나씩 체크하면 돼요.</div></div>`}
function monthPage(){let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),off=(first.getDay()+6)%7,days="";for(let i=0;i<off;i++)days+="<div></div>";for(let n=1;n<=last.getDate();n++){let d=new Date(y,m,n),id=iso(d),ts=db.tasks.filter(x=>x.date===id);days+=`<button class="day ${id===iso(today)?"today":""} ${id===iso(selected)?"sel":""}" data-date="${id}"><b>${n}</b><div class="dots">${ts.slice(0,5).map(()=>'<i class="dot"></i>').join("")}</div></button>`}return `<div class="card"><div class="head"><div><div class="title">📅 ${y}년 ${m+1}월</div><div class="sub">날짜를 누르면 그날의 계획으로 이동해요.</div></div><button class="btn primary" id="addGoal">+ 목표</button></div><div class="calendar">${["월","화","수","목","금","토","일"].map(x=>`<div class="dow">${x}</div>`).join("")}${days}</div></div><div class="card"><div class="title">🎯 이달의 목표</div><div class="list">${db.goals.length?db.goals.map(x=>`<div class="item"><button class="check ${x.done?"done":""}" data-toggle="goals" data-id="${x.id}"></button><span class="${x.done?"strike":""} grow">${esc(x.text)}</span></div>`).join(""):`<div class="empty">아직 목표가 없어요.</div>`}</div></div>`}
function settingsPage(){return `<div class="card"><div class="title">⚙️ 설정</div><div class="sub" style="margin-top:8px">계획과 체크 상태는 이 기기의 브라우저에 저장됩니다.</div><div class="actions"><button class="btn" id="reset">전체 초기화</button></div></div><div class="card"><div class="title">📝 메모</div><textarea id="notes" placeholder="자유롭게 적어두세요.">${esc(db.notes)}</textarea><div class="actions"><button class="btn primary" id="saveNotes">저장</button></div></div>`}
$("nav").onclick=e=>{let b=e.target.closest("button[data-page]");if(b)setPage(b.dataset.page)}
$("todayBtn").onclick=()=>setPage("today");$("close").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()}
$("view").addEventListener("click",e=>{
 let t=e.target.closest("[data-toggle]");if(t)toggle(t.dataset.toggle,Number(t.dataset.id));
 let d=e.target.closest("[data-del]");if(d)del(d.dataset.del,Number(d.dataset.id));
 let re=e.target.closest("[data-edit-routine]");if(re)routineEditForm(Number(re.dataset.editRoutine));
 let rd=e.target.closest("[data-del-routine]");if(rd&&confirm("이 아침 루틴을 삭제할까요?")){db.routine=db.routine.filter(x=>x.id!==Number(rd.dataset.delRoutine));save();render()}
 let date=e.target.closest("[data-date]");if(date){selected=new Date(date.dataset.date+"T12:00:00");page="today";render()}
 if(e.target.id==="addTask")taskForm();
 if(e.target.id==="addGoal")goalForm();
 if(e.target.id==="addRoutine")routineForm();
 if(e.target.id==="reset"&&confirm("모든 계획을 초기화할까요?")){localStorage.removeItem(KEY);location.reload()}
 if(e.target.id==="saveNotes"){db.notes=$("notes").value;save()}
});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
