<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="home-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루하루">
<title>하루하루 2.0</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#242424;--muted:#8a8a86;--line:#e9e9e5;--soft:#f0f0ed;--danger:#a44b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:22px 18px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}h1{font-size:28px;margin:0 0 4px}.date{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.tab,.pill,.ghost{background:var(--soft);color:#555;padding:10px 9px;border-radius:11px}.tab.active{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 16px #00000008}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.title{font-weight:700;font-size:17px}.small,.hint{font-size:12px;color:var(--muted);line-height:1.5}
.list{margin-top:9px}.item{display:flex;align-items:center;gap:9px;padding:11px 0;border-top:1px solid #f0f0ed}.item:first-child{border-top:0}.check{width:21px;height:21px;border:1px solid #bbb;border-radius:7px;background:white;flex:0 0 auto}.check.done{background:#333;border-color:#333;position:relative}.check.done:after{content:"✓";color:#fff;font-size:13px;position:absolute;left:4px;top:0}.doneText{text-decoration:line-through;color:#aaa}.grow{flex:1;min-width:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:var(--ink);color:#fff;padding:10px 13px;border-radius:11px}.mini{font-size:11px;color:#888;background:#f2f2ef;padding:4px 7px;border-radius:999px}.defer{font-size:11px;background:#eee;padding:5px 7px;border-radius:8px}.important{font-size:11px}.editBar{display:flex;justify-content:flex-end;margin:-2px 0 8px}.category{font-size:11px;background:#f0f0ed;color:#666;padding:4px 7px;border-radius:999px}.diary{min-height:150px}.calendarDiary{font-size:10px;margin-top:3px;color:#777}.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:5}.hidden{display:none}.sheet{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 12px;font-size:18px}.form input,.form select,.form textarea{width:100%;border:1px solid #ddd;border-radius:11px;padding:11px;margin:5px 0 8px;background:#fff}.form textarea{min-height:90px;resize:vertical}.tw{display:grid;grid-template-columns:1fr 1fr;gap:7px}.progress{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;background:#333;border-radius:99px}.sectionHead{display:flex;justify-content:space-between;align-items:center}.empty{padding:15px 0;color:#999;text-align:center;font-size:13px} .weeknav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.weeknav button{background:var(--soft);border-radius:9px;padding:7px 10px}.monthnav{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-bottom:14px}.monthnav>button{width:42px;height:42px;background:var(--soft);border-radius:10px;font-size:25px;line-height:1;color:#555}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calHead{text-align:center;color:#888;font-size:12px;font-weight:600;padding:5px 0}.calCell{min-width:0;min-height:58px;background:#fff;border:1px solid #eee;border-radius:10px;padding:7px 3px 5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:var(--ink)}.calCell.muted{color:#c4c4c0;background:#fafaf8}.calCell.today{border:2px solid #333;padding:6px 2px 4px}.calCell.selected{background:#f0f0ed}.calNum{font-size:14px;line-height:18px}.calDots{display:flex;gap:2px;margin-top:5px;height:5px}.calDot{width:4px;height:4px;border-radius:50%;background:#555}.calCount{font-size:9px;color:#888;margin-top:3px}.monthTasks{margin-top:12px}@media(max-width:380px){.calCell{min-height:52px;padding-left:1px;padding-right:1px}.calNum{font-size:13px}.calCount{font-size:8px}}
.auth{min-height:75vh;display:flex;align-items:center;justify-content:center}.auth .card{width:100%;max-width:480px}.status{font-size:12px;color:var(--muted);margin-top:7px}.error{color:var(--danger);font-size:12px;line-height:1.5;margin-top:8px}.loading{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row between"><h2 id="modalTitle">추가</h2><button class="ghost" onclick="closeModal()">닫기</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://vuawbraztecspgmjmnkb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_daGbnJPQ4lswaEXGzYiUEg_RMbilzaf';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const koDate=d=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d);
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let user=null;
let data={daily:[],weekly:[],monthly:[],routine:[],categories:[],diary:null,diaryMap:{}};
let routineDone={};
const ROUTINE_DONE_KEY='haruharu_routine_done_v2';
function routineDoneFor(date=iso(state.date)){let all=JSON.parse(localStorage.getItem(ROUTINE_DONE_KEY)||'{}');return all[date]||{};}
function setRoutineDone(id,next,date=iso(state.date)){let all=JSON.parse(localStorage.getItem(ROUTINE_DONE_KEY)||'{}');all[date]=all[date]||{};all[date][id]=next;localStorage.setItem(ROUTINE_DONE_KEY,JSON.stringify(all));}
let state={tab:'today',date:new Date(),weekOffset:0,editMode:false};

function root(){return document.getElementById('root')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function pct(arr){return arr.length?Math.round(arr.filter(x=>x.done).length/arr.length*100):0}
function progressCard(title,arr){let p=pct(arr);return `<div class="card"><div class="row between"><div class="title">${title}</div><span class="mini">${arr.filter(x=>x.done).length}/${arr.length}</span></div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}
function itemHtml(x,type){
 const meta=x.defer_count?`<span class="mini">↪ ${x.defer_count}회 미룸</span>`:'';
 const cat=x.category_id?(data.categories.find(c=>c.id===x.category_id)?.name||''):'';
 const edit=state.editMode?`<div class="actions"><button class="mini" onclick="editItem('${type}','${x.id}')">수정</button>${type==='daily'?`<button class="defer" onclick="deferTask('${x.id}')">↪ 내일</button>`:''}<button class="mini" onclick="deleteItem('${type}','${x.id}')">삭제</button></div>`:'';
 return `<div class="item"><button class="check ${x.done?'done':''}" onclick="toggleTask('${type}','${x.id}',${!x.done})"></button><div class="grow"><div class="${x.done?'doneText':''}">${esc(x.text)}</div><div>${cat?`<span class="category">${esc(cat)}</span>`:''} ${meta} ${x.note?`<span class="mini">메모 있음</span>`:''}</div>${edit}</div></div>`;
}

function shell(){return `<div class="app"><div class="top"><div><h1>하루하루</h1><div id="todayLabel" class="date"></div></div><button class="pill" onclick="goToday()">오늘</button></div><div class="tabs"><button class="tab ${state.tab==='today'?'active':''}" data-tab="today">오늘</button><button class="tab ${state.tab==='week'?'active':''}" data-tab="week">이번 주</button><button class="tab ${state.tab==='month'?'active':''}" data-tab="month">이번 달</button><button class="tab ${state.tab==='settings'?'active':''}" data-tab="settings">설정</button></div><main id="main"></main></div>`}

function today(){
 const id=iso(state.date), tasks=data.daily.filter(x=>x.date===id), routines=data.routine, diary=data.diary;
 return `${progressCard('오늘의 할 일',tasks)}
 <div class="card"><div class="sectionHead"><div><div class="title">☀️ 아침 루틴</div><div class="small">매일 반복되는 루틴은 여기서 따로 관리해요.</div></div><button class="pill" onclick="addRoutine()">+ 추가</button></div>
 <div class="list">${routines.length?routines.map(r=>{const done=!!routineDone[r.id];return `<div class="item"><button class="check ${done?'done':''}" onclick="toggleRoutine('${r.id}',${!done})"></button><div class="grow"><span class="${done?'doneText':''}">${esc(r.text)}</span><div class="small">${esc(r.time)}</div></div></div>`}).join(''):'<div class="empty">아침 루틴을 추가해보세요.</div>'}</div></div>
 <div class="card"><div class="sectionHead"><div class="title">📝 오늘 할 일</div><button class="primary" onclick="addItem('daily')">+ 추가</button></div>${tasks.length?`<div class="editBar"><button class="pill" onclick="state.editMode=!state.editMode;render()">${state.editMode?'편집 완료':'편집'}</button></div>`:''}<div class="list">${tasks.length?tasks.map(x=>itemHtml(x,'daily')).join(''):'<div class="empty">오늘 할 일을 추가해보세요.</div>'}</div></div>
 <div class="card"><div class="sectionHead"><div><div class="title">📖 오늘의 일기</div><div class="small">오늘 있었던 일을 자유롭게 적어보세요.</div></div><button class="pill" onclick="editDiary()">${diary?'수정':'쓰기'}</button></div>${diary?.content?`<div style="margin-top:12px;white-space:pre-wrap;line-height:1.7">${esc(diary.content)}</div>`:'<div class="empty">아직 오늘의 일기가 없어요.</div>'}</div>`;
}
function weekRange(){let d=addDays(new Date(),state.weekOffset*7);let day=(d.getDay()+6)%7;let mon=addDays(d,-day);return [mon,addDays(mon,6)]}
function week(){let [a,b]=weekRange(), w=data.weekly.filter(x=>x.week_start===iso(a));return `<div class="card"><div class="weeknav"><button onclick="state.weekOffset--;loadData()">‹</button><div><div class="title">이번 주</div><div class="small">${koDate(a)} ~ ${koDate(b)}</div></div><button onclick="state.weekOffset++;loadData()">›</button></div></div>${progressCard('이번 주 진행률',w)}<div class="card"><div class="sectionHead"><div class="title">📌 이번 주 할 일</div><button class="primary" onclick="addItem('weekly')">+ 추가</button></div>${w.length?`<div class="editBar"><button class="pill" onclick="state.editMode=!state.editMode;render()">${state.editMode?'편집 완료':'편집'}</button></div>`:''}<div class="list">${w.length?w.map(x=>itemHtml(x,'weekly')).join(''):'<div class="empty">이번 주에 해야 할 일을 따로 적어보세요.</div>'}</div></div>`}
function month(){
 let d=state.date,y=d.getFullYear(),m=d.getMonth(),key=`${y}-${pad(m+1)}-01`,items=data.monthly.filter(x=>x.month_start===key);
 let first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate();
 let cells=[];
 for(let i=0;i<42;i++){
   let n=i-start+1,cellDate,muted=false;
   if(n<1){cellDate=new Date(y,m-1,prevLast+n);muted=true}
   else if(n>last){cellDate=new Date(y,m+1,n-last);muted=true}
   else cellDate=new Date(y,m,n);
   let keyDate=iso(cellDate),dayTasks=data.daily.filter(x=>x.date===keyDate),hasDiary=data.diaryMap?.[keyDate],isToday=keyDate===iso(new Date()),isSelected=keyDate===iso(state.date);
   cells.push(`<button class="calCell ${muted?'muted':''} ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectCalendarDate('${keyDate}')"><span class="calNum">${cellDate.getDate()}</span>${dayTasks.length?`<span class="calDots">${dayTasks.slice(0,4).map(()=>'<i class="calDot"></i>').join('')}</span><span class="calCount">${dayTasks.length}개</span>`:''}${hasDiary?'<span class="calendarDiary">📝</span>':''}</button>`)
 }
 return `<div class="card"><div class="monthnav"><button onclick="changeMonth(-1)">‹</button><div style="text-align:center"><div class="title">${y}년 ${m+1}월</div><div class="small">날짜를 누르면 그날의 할 일을 볼 수 있어요.</div></div><button onclick="changeMonth(1)">›</button></div><div class="calendar">${['월','화','수','목','금','토','일'].map(x=>`<div class="calHead">${x}</div>`).join('')}${cells.join('')}</div></div>${progressCard('이번 달 진행률',items)}<div class="card monthTasks"><div class="sectionHead"><div><div class="title">📌 이번 달 할 일</div><div class="small">일간·주간과 별도로 관리해요.</div></div><button class="primary" onclick="addItem('monthly')">+ 추가</button></div>${items.length?`<div class="editBar"><button class="pill" onclick="state.editMode=!state.editMode;render()">${state.editMode?'편집 완료':'편집'}</button></div>`:''}<div class="list">${items.length?items.map(x=>itemHtml(x,'monthly')).join(''):'<div class="empty">이번 달 할 일을 추가해보세요.</div>'}</div></div>`
}
function changeMonth(n){let d=new Date(state.date);d.setDate(1);d.setMonth(d.getMonth()+n);state.date=d;loadData()}
function selectCalendarDate(key){state.date=new Date(key+'T12:00:00');state.tab='today';loadData()}

function settings(){return `<div class="card"><div class="title">⚙️ 설정</div><div class="small" style="margin-top:7px">☁️ Supabase에 연결된 버전이에요. 같은 계정으로 로그인하면 계획이 이어집니다.</div><div class="status">로그인: ${esc(user?.email||'')}</div><div class="actions"><button class="ghost" onclick="signOut()">로그아웃</button></div></div><div class="card"><div class="sectionHead"><div><div class="title">🏷️ 카테고리 관리</div><div class="small">할 일에 붙일 카테고리를 직접 추가·수정·삭제할 수 있어요.</div></div><button class="primary" onclick="addCategory()">+ 추가</button></div><div class="list">${data.categories.length?data.categories.map(c=>`<div class="item"><div class="grow"><span class="category">${esc(c.name)}</span></div><button class="mini" onclick="editCategory('${c.id}')">수정</button><button class="mini" onclick="deleteCategory('${c.id}')">삭제</button></div>`).join(''):'<div class="empty">카테고리를 추가해보세요.</div>'}</div></div><div class="card"><div class="title">↪️ 미루기</div><div class="small" style="margin-top:7px">오늘 할 일의 편집에서 ‘↪ 내일’을 누르면 다음 날로 이동하고 미룬 횟수가 기록돼요.</div></div>`}
function authView(msg=''){root().innerHTML=`<div class="app"><div class="auth"><div class="card"><h1>하루하루</h1><div class="small">내 계획을 안전하게 저장해요.</div><div class="form" style="margin-top:14px"><input id="authEmail" type="email" placeholder="이메일"><input id="authPassword" type="password" placeholder="비밀번호"><div class="actions"><button class="primary" onclick="signIn()">로그인</button></div>${msg?`<div class="error">${esc(msg)}</div>`:''}</div></div></div></div>`}

async function signIn(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||!password)return authView('이메일과 비밀번호를 입력해주세요.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return authView(error.message);await start()}
async function signOut(){await sb.auth.signOut();user=null;authView()}

async function loadData(){
 if(!user)return; routineDone=routineDoneFor();
 const [d,w,m,r,c,di,dm]=await Promise.all([
  sb.from('tasks').select('*').eq('user_id',user.id).eq('type','daily'),sb.from('tasks').select('*').eq('user_id',user.id).eq('type','weekly'),sb.from('tasks').select('*').eq('user_id',user.id).eq('type','monthly'),sb.from('routines').select('*').eq('user_id',user.id).order('sort_order',{ascending:true}).order('created_at',{ascending:true}),sb.from('categories').select('*').eq('user_id',user.id).order('name'),sb.from('diaries').select('*').eq('user_id',user.id).eq('date',iso(state.date)).maybeSingle(),sb.from('diaries').select('date').eq('user_id',user.id)
 ]);
 const errors=[d,w,m,r,c,di,dm].filter(x=>x.error);if(errors.length){console.error(errors);root().innerHTML=shell();document.getElementById('main').innerHTML=`<div class="card"><div class="title">데이터를 불러오지 못했어요.</div><div class="error">${esc(errors[0].error.message)}</div></div>`;return}
 data={daily:d.data||[],weekly:w.data||[],monthly:m.data||[],routine:r.data||[],categories:c.data||[],diary:di.data||null,diaryMap:Object.fromEntries((dm.data||[]).map(x=>[x.date,true]))};
 if(!data.categories.length){await seedCategories();return loadData();} render();
}
function render(){root().innerHTML=shell();document.getElementById('todayLabel').textContent=koDate(state.date);document.getElementById('main').innerHTML=state.tab==='today'?today():state.tab==='week'?week():state.tab==='month'?month():settings();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.date=new Date();state.weekOffset=0;state.editMode=false;loadData()})}

function categoryOptions(selected=''){return `<option value="">카테고리 없음</option>${data.categories.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}`}
function addItem(type,existing){let isD=type==='daily',x=existing,title=x?'할 일 수정':type==='weekly'?'이번 주 할 일 추가':type==='monthly'?'이번 달 할 일 추가':'오늘 할 일 추가',defaultDate=x?.date||iso(state.date);openModal(title,`<div class="form"><input id="fText" placeholder="할 일을 적어주세요" value="${x?esc(x.text):''}">${isD?`<input id="fDate" type="date" value="${defaultDate}">`:''}<select id="fCat">${categoryOptions(x?.category_id||'')}</select><textarea id="fNote" placeholder="메모 (선택)">${x?esc(x.note||''):''}</textarea><div class="actions"><button class="primary" onclick="saveItem('${type}','${x?.id||''}')">${x?'저장':'추가'}</button><button class="ghost" onclick="closeModal()">취소</button></div></div>`)}
async function saveItem(type,id){let text=document.getElementById('fText').value.trim();if(!text)return;let payload={user_id:user.id,type,text,done:false,category_id:document.getElementById('fCat').value||null,note:document.getElementById('fNote').value.trim(),updated_at:new Date().toISOString()};if(type==='daily')payload.date=document.getElementById('fDate').value||iso(state.date);if(type==='weekly')payload.week_start=iso(weekRange()[0]);if(type==='monthly')payload.month_start=`${state.date.getFullYear()}-${pad(state.date.getMonth()+1)}-01`;
 let res;if(id){delete payload.user_id;delete payload.type;delete payload.done;res=await sb.from('tasks').update(payload).eq('id',id).eq('user_id',user.id)}else{payload.defer_count=0;res=await sb.from('tasks').insert(payload)}if(res.error){alert(res.error.message);return}closeModal();await loadData()}
function editItem(type,id){let arr=type==='daily'?data.daily:type==='weekly'?data.weekly:data.monthly;let x=arr.find(a=>a.id===id);if(x)addItem(type,x)}
async function toggleTask(type,id,next){const {error}=await sb.from('tasks').update({done:next,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id);if(error){alert(error.message);return}await loadData()}
async function deleteItem(type,id){if(!confirm('이 할 일을 삭제할까요?'))return;const {error}=await sb.from('tasks').delete().eq('id',id).eq('user_id',user.id);if(error){alert(error.message);return}await loadData()}
async function deferTask(id){let x=data.daily.find(a=>a.id===id);if(!x)return;let old=x.date,newDate=iso(addDays(new Date(old+'T12:00:00'),1));const {error}=await sb.from('tasks').update({date:newDate,defer_count:(x.defer_count||0)+1,deferred_from:old,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id);if(error){alert(error.message);return}await loadData()}
async function seedCategories(){for(const name of ['공부','생활','개인']){await sb.from('categories').insert({user_id:user.id,name})}}
function addCategory(){openModal('카테고리 추가',`<div class="form"><input id="catName" placeholder="예: 수능"><div class="actions"><button class="primary" onclick="saveCategory()">추가</button><button class="ghost" onclick="closeModal()">취소</button></div></div>`)}
function editCategory(id){let c=data.categories.find(x=>x.id===id);if(!c)return;openModal('카테고리 수정',`<div class="form"><input id="catName" value="${esc(c.name)}"><div class="actions"><button class="primary" onclick="saveCategory('${id}')">저장</button><button class="ghost" onclick="closeModal()">취소</button></div></div>`)}
async function saveCategory(id){let name=document.getElementById('catName').value.trim();if(!name)return;if(id){const {error}=await sb.from('categories').update({name}).eq('id',id).eq('user_id',user.id);if(error){alert(error.message);return}}else{const {error}=await sb.from('categories').insert({user_id:user.id,name});if(error){alert(error.message);return}}closeModal();await loadData()}
async function deleteCategory(id){if(!confirm('이 카테고리를 삭제할까요?\n사용 중인 할 일에서는 카테고리가 해제됩니다.'))return;await sb.from('tasks').update({category_id:null}).eq('category_id',id).eq('user_id',user.id);const {error}=await sb.from('categories').delete().eq('id',id).eq('user_id',user.id);if(error){alert(error.message);return}await loadData()}
function editDiary(){let d=data.diary;openModal('오늘의 일기',`<div class="form"><textarea id="diaryText" class="diary" placeholder="오늘은 어땠나요?">${d?esc(d.content):''}</textarea><div class="actions"><button class="primary" onclick="saveDiary()">저장</button><button class="ghost" onclick="closeModal()">취소</button>${d?`<button class="ghost" onclick="deleteDiary()">삭제</button>`:''}</div></div>`)}
async function saveDiary(){let content=document.getElementById('diaryText').value.trim(),date=iso(state.date);if(!content){await deleteDiary();return}const {error}=await sb.from('diaries').upsert({user_id:user.id,date,content,updated_at:new Date().toISOString()},{onConflict:'user_id,date'});if(error){alert(error.message);return}closeModal();await loadData()}
async function deleteDiary(){const date=iso(state.date);const {error}=await sb.from('diaries').delete().eq('user_id',user.id).eq('date',date);if(error){alert(error.message);return}closeModal();await loadData()}
function addRoutine(){openModal('아침 루틴 추가',`<div class="form"><input id="rTime" type="time" value="07:00"><input id="rText" placeholder="예: 물 한 잔"><div class="actions"><button class="primary" onclick="saveRoutine()">추가</button></div></div>`)}
async function saveRoutine(){let time=document.getElementById('rTime').value||'07:00',text=document.getElementById('rText').value.trim();if(!text)return;let max=Math.max(-1,...data.routine.map(r=>r.sort_order||0));const {error}=await sb.from('routines').insert({user_id:user.id,time,text,sort_order:max+1,active:true});if(error){alert(error.message);return}closeModal();await loadData()}
async function toggleRoutine(id,next){setRoutineDone(id,next);routineDone=routineDoneFor();render()}
function goToday(){state.tab='today';state.date=new Date();state.weekOffset=0;loadData()}

async function start(){root().innerHTML='<div class="app"><div class="loading">하루하루를 불러오는 중…</div></div>';const {data:s}=await sb.auth.getSession();user=s.session?.user||null;if(!user){authView();return}await loadData()}
sb.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(user)loadData();else authView()});
start();
</script>
</body>
</html>
